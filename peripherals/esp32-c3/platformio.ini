; ESP_Sentinel — ESP32-C3 telemetry bridge (MKR Zero UART <-> Jetson USB-C).
;
; Build:  pio run            (from this directory)
; Flash:  pio run -t upload
;
; PlatformIO compiles src/main.cpp and every library under lib/ (commLink,
; hostLink) automatically via its library dependency finder; the root-level
; esp32-c3.ino is outside src/ and is ignored here.
;
; This path is UNVERIFIED against this tree — PlatformIO is not installed on the
; development machine.  BuildAndUpload.cmd (arduino-cli) is the verified build
; and is what the README documents; keep this file in step with its FQBN flags.

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; Native-USB board: route Serial to USB-CDC so UART0's GPIO20/21 are free for
; Serial1 (the master link). Drop these two flags for CH340/CP210x bridge boards.
; hostLink.h enforces ARDUINO_USB_CDC_ON_BOOT at compile time — without it the
; bridge would try to talk to the Jetson over UART0's GPIO20/21, which commLink
; is already driving for the MKR Zero link.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra

; Common alternative boards (same chip, different pin labels):
; board = esp32-c3-devkitm-1
; board = lolin_c3_mini
