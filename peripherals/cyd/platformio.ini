; CYD dashboard. BuildAndUpload.cmd is the verified local build path.
[env:esp32-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

lib_deps =
    adafruit/Adafruit ILI9341@1.6.4
    bitbank2/JPEGDEC@1.8.4
; Audio uses the Arduino-ESP32 3.x DAC driver. The verified build is Arduino CLI.
