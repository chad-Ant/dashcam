; Arduino core 3.2.0 / ESP-IDF 5.4.1 (LEDC and modern I2S APIs required).
[env:es3c28p]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = app3M_fat9M_16MB.csv
monitor_speed = 115200
lib_deps =
    bitbank2/JPEGDEC@1.8.4
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ILI9341@1.6.4
build_flags =
    -Wall
    -Wextra
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Compare throughput using the native TinyUSB peripheral on the same board.
[env:es3c28p-tinyusb]
extends = env:es3c28p
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -Wall
    -Wextra
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
